[build-system]
requires = ["scikit-build-core >=0.11", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "ovpsolver"
version = "0.0.1"
description = "Discontinuous Galerkin finite-element solver for stateful phase-field systems governed by an Onsager variational principle"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anand Srinivasan" }]
requires-python = ">=3.12"

# Only what pip can actually install. The solve itself needs dolfinx, basix, ufl,
# petsc4py, mpi4py and gmsh, and those are not listed: they are not reliably
# pip-installable, and naming them here would turn a clean failure at
# environment-creation time into a confusing one at import time. `environment.yml`
# is what installs them, and it is the supported way to get an environment; this
# list is what `pip install .` adds on top of one that already exists.
dependencies = [
    "colorcet",
    "matplotlib",
    "numpy",
    "pyvista",
    "pyyaml",
    "seaborn",
    "scipy",
    "tqdm",
]

# No console scripts. A mixture is its own command line -- ``python -m
# ovpsolver.polymerizing_b run | visualize.phases | ...``
# -- and a user's subclass gets the same one by calling ``main()`` in its own
# module. Installing a fixed name per figure would fix the mixture too.

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/ovpsolver"]
wheel.py-api = "cp312"

[project.urls]
Repository = "https://github.com/asrvsn/ovpsolver"

[tool.pytest.ini_options]
# Named, so that only the suite is collected: a script elsewhere in the tree
# called ``test_*`` would otherwise be run at import.
testpaths = ["tests"]
